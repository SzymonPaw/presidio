limit_req_zone $binary_remote_addr
    zone=presidio_general:10m
    rate=60r/m;

limit_req_zone $binary_remote_addr
    zone=presidio_admin:10m
    rate=5r/m;

upstream presidio_backend {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80;
    server_name presidio.example.internal;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name presidio.example.internal;

    server_tokens off;

    ssl_certificate     /etc/ssl/certs/presidio.crt;
    ssl_certificate_key /etc/ssl/private/presidio.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security
        "max-age=31536000" always;

    client_max_body_size 55m;
    client_body_timeout 60s;
    send_timeout 130s;

    limit_req_status 429;

    location = /adminstbu {
        limit_req zone=presidio_admin burst=3 nodelay;

        proxy_pass http://presidio_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://presidio_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
    }

    location / {
        limit_req zone=presidio_general burst=20 nodelay;

        proxy_pass http://presidio_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        proxy_request_buffering off;
        proxy_buffering off;
    }
}