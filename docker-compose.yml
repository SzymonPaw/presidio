services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_presidio_app
    user: "10001:10001"
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
