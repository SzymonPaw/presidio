<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="robots" content="noindex">
    <title>Anonimizator dokumentów | STBU.pl</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="shortcut icon" href="/static/img/favicon.webp" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>Anonimizator dokumentów | STBU</h1>
        <h2>Po zakończeniu procesu usuwania wrażliwych danych, sprawdź efekt działania narzędzia!</h2>
        <p class="subtitle">Lokalne narzędzie do anonimizacji danych w dokumentach</p>

        <form id="upload-form" class="upload-form">
            <label for="file-input" class="file-label">
                <span>Wybierz plik (PDF, DOCX, XLSX) lub przeciągnij tutaj</span>
                <input type="file" id="file-input" name="file" class="file-input" accept=".pdf,.docx,.xlsx" hidden>
            </label>
            <div id="file-info" class="file-info"></div>
            <button type="submit" id="analyze-btn" class="btn btn-primary" disabled>Analizuj</button>
        </form>

        <div id="status" class="status"></div>
        <div id="findings" class="findings"></div>
        <div id="result" class="result"></div>
    </div>

    <!-- Modal podglądu -->
    <div id="preview-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Podgląd dokumentu (strona <span id="preview-page-num">0</span>)</h2>
            <div class="modal-body">
                <img id="preview-image" src="" alt="Podgląd strony PDF">
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
